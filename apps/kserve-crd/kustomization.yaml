apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # This now points to the local file within the same directory.
  - kserve-cluster-resources.yaml

# This patch adds an annotation to all ClusterServingRuntime resources.
# The 'SkipDryRun=true' option tells ArgoCD to apply the resource without
# client-side validation, which resolves the race condition.
patches:
  - patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: SkipDryRun=true
    target:
      group: serving.kserve.io
      version: v1alpha1
      kind: ClusterServingRuntime